dataset:
  name: cifar10
  root: ./data
model:
  family: vit
  image_size: 32
  patch_size: 4
  dim: 768
  depth: 12
  heads: 12
  mlp_dim: 3072
  dropout: 0.1
  emb_dropout: 0.0
training:
  epochs: 300
  batch_size: 512
  learning_rate: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 10
  min_lr: 1.0e-06
  ema_decay: null
  randaugment: true
  mixup_cutmix: true
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  seed: 42
