dataset:
  name: cifar10
  root: ./data
model:
  family: resnet
  depth: 34
training:
  epochs: 300
  batch_size: 8192
  learning_rate: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 10
  min_lr: 1.0e-06
  ema_decay: null
  randaugment: true
  mixup_cutmix: true
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  seed: 42
