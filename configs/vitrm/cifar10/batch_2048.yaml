dataset:
  name: cifar10
  root: ./data
model:
  family: vitrm
  image_size: 32
  patch_size: 4
  in_chans: 3
  dim: 384
  num_heads: 6
  mlp_hidden_dim: 512
  n_latent_steps: 3
  t_deep: 1
  n_supervision: 1
  halt_threshold: 0.5
  dropout: 0.1
  latent_dropout: 0.0
  token_dropout: 0.0
training:
  epochs: 1000
  batch_size: 2048
  learning_rate: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 30
  min_lr: 1.0e-06
  ema_decay: 0.999
  randaugment: true
  mixup_cutmix: true
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  seed: 42
